[project]
name = "cmct"
version = "0.1.0"
description = "Cross-model co-training for unsupervised domain adaptation on CLIP"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "torchvision>=0.15", "numpy", "pillow", "pyyaml", "regex", "ftfy", "yacs", "tqdm", "gdown"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmct", "vendor"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vendor", "cmct/clip"]

[tool.ruff.lint]
# PLR0402 (`import torch.nn as nn`) and UP008 (`super(Cls, self)`) are used
# consistently throughout this codebase and are left as house style rather
# than rewritten file by file.
ignore = ["PLR0402", "UP008"]

[tool.ruff.lint.per-file-ignores]
# Findings suppressed in place rather than rewritten, to keep these modules'
# structure stable.
"cmct/branch_lora/lora/layers.py" = ["PERF102", "UP039", "PLR2044", "PLR1704", "F841", "B006", "I001"]
"cmct/branch_mlp/loss.py" = ["I001"]
"cmct/branch_mlp/backbone.py" = ["RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
