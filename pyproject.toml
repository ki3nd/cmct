[project]
name = "cmct"
version = "0.1.0"
description = "Cross-Model Co-Training for unsupervised domain adaptation on vision-language models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "pillow",
    "pyyaml",
    # vendored CLIP tokenizer (cmct/backbones/clip/tokenizer.py) needs these
    "regex",
    "ftfy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
log = ["tensorboard"]

[project.scripts]
cmct = "cmct.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmct"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored upstream CLIP: kept byte-identical, so it is not ours to lint.
extend-exclude = ["cmct/backbones/clip/model.py", "cmct/backbones/clip/tokenizer.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
