dataset: officehome

data:
  root: /home/pc1175/DA-Research/data_root
  source_domains: [art]
  target_domains: [clipart]
  batch_size_test: 128
  num_workers_test: 8
  clarify_classnames: false

cotrain:
  total_macro_steps: 1000
  # macro: the cross-teaching reference is computed once per macro-step
  # micro: recomputed at every branch step
  cross_ref_refresh: macro
  ensemble: mean_prob

branches:
  - name: lora
    type: lora_clip
    backbone:
      checkpoint: assets/ViT-B-16.pt
      dtype: fp16
    stream:
      batch_size_x: 32
      batch_size_u: 32
      num_workers: 8
      strong_aug: false
    optim:
      # NOTE: with scheduler warmup_cosine and warmup_steps > 0, `lr` has NO
      # effect on the learning rate -- the cosine's amplitude is warmup_lr. That
      # is what the reference does: CosineAnnealingLR scales the group's current
      # lr recursively rather than reading base_lrs, and the reference overwrites
      # that lr with warmup_lr on every warmup step. `lr` is kept here because it
      # is the value the reference passes to the optimizer constructor, and
      # dropping it would hide that the two differ by 3.5x.
      lr: 0.0035
      warmup_lr: 0.001
      momentum: 0.9
      weight_decay: 0.0005
      grad_clip: 20.0
      scheduler: warmup_cosine
    ema:
      # 0.99, the schema default. The codebase this comes from used 0.996
      # (train.py:202, --s1-ema-momentum) -- this is a deliberate deviation.
      momentum: 0.99
      schedule: const
    pseudo_label:
      threshold: 0.85
      self_reduce: mask
    steps_per_macro: 1
    warmup_steps: 50
    cross_weight: 0.5
    cross_mode: mask
    extra:
      mmd_weight: 1.0
      lora_rank: 2
      lora_alpha: 1.0
      lora_dropout: 0.0
      # q, k, v only -- NOT o, so out_proj keeps no LoRA. The wrapper class
      # defaults to ['q','k','v','o'], but both trainer configs pass
      # ['q','k','v'], and a class default is not a configuration.
      lora_params: [q, k, v]
      lora_encoder: both
      lora_rank_ramp: [2, 4, 6, 8, 10]

  - name: vlp
    type: vlp_clip
    backbone:
      checkpoint: assets/ViT-B-16.pt
      dtype: fp32
    stream:
      batch_size_x: 32
      batch_size_u: 32
      num_workers: 8
      strong_aug: false
    optim:
      lr: 0.000003
      momentum: 0.9
      weight_decay: 0.0005
      nesterov: true
      scheduler: inv
      gamma: 0.0003
      decay: 0.75
      param_group_multipliers:
        classifier: 1000.0
    ema:
      momentum: 0.99
      schedule: ramp
    pseudo_label:
      threshold: 0.85
      self_reduce: mask
    steps_per_macro: 10
    warmup_steps: 500
    cross_weight: 0.5
    cross_mode: mask
    extra:
      label_smoothing: 0.1
      lambda1: 0.25
      lambda2: 0.1
      lambda3: 0.025

run:
  output_dir: outputs/officehome_a2c
  seed: 42
  device: cuda:0
  print_freq: 50
  # in macro-steps; x steps_per_macro = every 500 branch steps, 20 evals total
  eval_freq: 50
