# Class names whose bare form is ambiguous in English, so CLIP's text embedding
# lands on the wrong sense. Applied only when data.clarify_classnames is on.
# Keys are class names lowercased with underscores turned into spaces.
classname_overrides:
  mouse: computer mouse
  monitor: computer monitor
  computer: desktop computer
  tv: television
  notebook: paper notebook
  keyboard: computer keyboard
  glasses: eyeglasses
  speaker: loudspeaker
  fan: electric fan
  marker: marker pen
  soda: soda can
  pan: frying pan
  drill: power drill
  ruler: measuring ruler
  sink: kitchen sink
  folder: file folder
  postit notes: post-it notes
  flipflops: flip-flops
  clipboards: clipboard
  lamp shade: lampshade
  file cabinet: filing cabinet
